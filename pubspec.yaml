name: as_built
description: Professional wind turbine installation management system

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management - 🆕 VERSÕES COMPATÍVEIS
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Firebase
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_auth: ^6.1.3
  firebase_storage: ^13.0.5

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.1
  fl_chart: ^1.1.1
  percent_indicator: ^4.2.3
  
  # Utils
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.2.0
  file_picker: ^10.3.10
  permission_handler: ^12.0.1
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  connectivity_plus: ^7.0.0
  flutter_email_sender: ^8.0.0
  open_filex: ^4.7.0
  pdf: ^3.11.0
  printing: ^5.11.0
  image: ^4.5.4
  google_mlkit_text_recognition: ^0.15.1
  flutter_tesseract_ocr: ^0.4.16
  flutter_localizations:
    sdk: flutter
  
  # Mobile - UI Responsive
  flutter_screenutil: ^5.9.0
  
  # Images Cache
  cached_network_image: ^3.3.0

    # Para abrir ficheiros (NOVO)
  url_launcher: ^6.2.2
  
  # Path (útil)
  path: ^1.8.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - NCR.jpg
    - assets/ncr_pdf_template.png
    - assets/ncr_turbine_watermark.png
    - assets/master_template.json
    - assets/tessdata_config.json
    - assets/tessdata/

